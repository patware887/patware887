<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
<radialGradient id="glow" cx="1" cy="0" r="0.9"><stop offset="0" stop-color="#3B82F6" stop-opacity="0.22"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="880" height="230" rx="16"/></clipPath>
<style>
.h{font:700 26px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f0f6fc}
.s{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8B5CF6}
.d{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9da7b3}
.t{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
.k{font:700 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#22C55E;letter-spacing:1px}
</style>
</defs>
<g clip-path="url(#c)">
<rect width="880" height="230" fill="url(#bg)"/>
<rect width="880" height="230" fill="url(#glow)"/>
<rect width="880" height="4" fill="url(#ac)"/>
</g>
<rect x="0.5" y="0.5" width="879" height="229" rx="15.5" fill="none" stroke="url(#ac)" stroke-opacity="0.55"/>
<text x="28" y="52" class="h">CodeStack</text>
<text x="28" y="80" class="s">Flagship · Multi-tenant coding-education platform</text>
<rect x="790" y="22" width="62" height="24" rx="12" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.5"/>
<circle cx="804" cy="34" r="4" fill="#22C55E"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
<text x="814" y="38" class="k">LIVE</text>
<text x="28" y="112" class="d">Professors author problems &amp; assignments, students submit code judged asynchronously in an isolated</text><text x="28" y="132" class="d">Piston sandbox, verdicts stream live over WebSockets. Every university is an isolated tenant behind</text><text x="28" y="152" class="d">an 8-layer permission engine.</text>
<rect x="28" y="185" width="59" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.45"/><text x="57.5" y="200" class="t" text-anchor="middle">NestJS</text><rect x="95" y="185" width="72" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.45"/><text x="131.0" y="200" class="t" text-anchor="middle">React 19</text><rect x="175" y="185" width="105" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.45"/><text x="227.5" y="200" class="t" text-anchor="middle">PostgreSQL 16</text><rect x="288" y="185" width="59" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.45"/><text x="317.5" y="200" class="t" text-anchor="middle">BullMQ</text><rect x="355" y="185" width="53" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.45"/><text x="381.5" y="200" class="t" text-anchor="middle">Redis</text><rect x="416" y="185" width="79" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.45"/><text x="455.5" y="200" class="t" text-anchor="middle">Socket.IO</text><rect x="503" y="185" width="59" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.45"/><text x="532.5" y="200" class="t" text-anchor="middle">Piston</text><rect x="570" y="185" width="59" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.14" stroke="#8B5CF6" stroke-opacity="0.45"/><text x="599.5" y="200" class="t" text-anchor="middle">Docker</text>
</svg>
